version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: gogl-rcs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goglrcs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goglrcs123}
      POSTGRES_DB: ${POSTGRES_DB:-gogl_rcs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goglrcs}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gogl-rcs-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: gogl-rcs-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gogl-rcs-network

  # RabbitMQ Message Broker (Optional - for Pub/Sub)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gogl-rcs-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-goglrcs}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-goglrcs123}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - gogl-rcs-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  gogl-rcs-network:
    driver: bridge


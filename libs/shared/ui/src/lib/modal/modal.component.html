<div *ngIf="show" class="modal__backdrop" (click)="onBackdropClick($event)">
  <div [class]="getModalClasses().join(' ')" role="dialog" aria-modal="true" [attr.aria-labelledby]="title ? 'modal-title' : null">
    <div class="modal__header" *ngIf="title">
      <h2 class="modal__title" id="modal-title">{{ title }}</h2>
      <button class="modal__close" type="button" aria-label="Close modal" (click)="close()">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <div class="modal__body">
      <ng-content></ng-content>
    </div>
    <div class="modal__footer">
      <ng-content select="[footer]"></ng-content>
    </div>
  </div>
</div>
